[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presscorner-builder"
version = "0.1.1"
description = "Build research-ready datasets from the European Commission Press Corner (1985-present, archives back to 1975)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timo Seidl" }]
keywords = ["european-commission", "press-releases", "eu", "political-science", "text-as-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Sociology",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "responses>=0.24"]

[project.scripts]
presscorner = "presscorner_builder.cli:main"

[project.urls]
Homepage = "https://github.com/tseidl/presscorner-builder"

[tool.setuptools.packages.find]
where = ["src"]
